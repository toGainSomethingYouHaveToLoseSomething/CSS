<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Align</title>
    <style>
        #id1{
            background-color: black;
            color: wheat;
            height: 100px;
            width: 450px;
            text-align: center;
        }
        #id2{
            height: 50px;
            width: 50px;
            background-color: red;
        }
        p{
            background-color: red;
            width: 150px;
        }
    </style>
</head>
<body>
    <div id="id1">
        <p>hello this is div</p>
        <div id="id2">
           yoo
        </div>
    </div>
    
</body>
</html>
