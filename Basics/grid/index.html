<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .grid-container{
            display: grid;
            /* grid-template-columns: 300px 300px 300px;
            grid-template-rows: 300px 300px 300px; */
            /* grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr; */
            /* gap: 1em; */

            /* justify-items: center;
            align-items: center; */

            /* justify-content: center;
            align-content: center; */
            /* these two works on grid-container height and weight, centers all items */
            
            gap: 1em;
            
            grid-auto-columns: 200px;
            grid-auto-rows:200px;

            grid-template-areas: 
            "box-1 box-2 box-2 box-3"
            "box-1 box-4 box-5 box-5";
            width: fit-content;
        }

        .items{
            /* height: 100px;
            width: 100px; */
            padding: 2em;
            background-color: blueviolet;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="items " style="grid-area: box-1;">Item 1</div>
        <div class="items " style="grid-area: box-2;">Item 2</div>
        <div class="items " style="grid-area: box-3;">Item 3</div>
        <div class="items " style="grid-area: box-4;">Item 4</div>
        <div class="items " style="grid-area: box-5;">Item 5</div>
        <!-- <div class="items " style="grid-area: box-6;">Item 6</div>
        <div class="items " style="grid-area: box-7;">Item 7</div>
        <div class="items " style="grid-area: box-8;">Item 8</div>
        <div class="items " style="grid-area: box-9;">Item 9</div> -->
    </div>
</body>
</html>
