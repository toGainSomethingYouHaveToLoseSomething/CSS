<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 300px 300px 300px;
            grid-template-rows: 300px 300px 300px;
            /* grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr; */
            gap: 1em;

            justify-items: center;
            align-items: center;

            /* justify-content: center;
            align-content: center; */
            /* these two works on grid-container height and weight, centers all items */
        }

        .items{
            height: 100px;
            width: 100px;
            padding: 2em;
            background-color: blueviolet;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="items">Item 1</div>
        <div class="items">Item 2</div>
        <div class="items">Item 3</div>
        <div class="items">Item 4</div>
        <div class="items">Item 5</div>
        <div class="items">Item 6</div>
        <div class="items">Item 7</div>
        <div class="items">Item 8</div>
        <div class="items">Item 9</div>
    </div>
</body>
</html>
