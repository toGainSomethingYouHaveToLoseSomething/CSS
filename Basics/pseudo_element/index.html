<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo element</title>
    <style>
        h1{
            position: relative;
            width: max-content;
        }
        h1::after{
            content: '';
            height: 0.2em;
            width:100%;
            background-color: red;
            position: absolute;
            bottom: 0;
            left: 0;

            background-image: linear-gradient(to right, blue, red);
            border-radius: 1em;
            scale: 0;
            transition: scale 200ms ease;
        }
        h1:hover::after{
            scale: 1;
        }
        h2::before{
            content: 'xyz';
        }
    </style>
</head>
<body>
    <h1>hello world</h1>
    <h2>hello world</h2>
</body>
</html>
