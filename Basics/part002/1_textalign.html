<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Align</title>
    <style>
        *{
            font-family: 'Times New Roman', Times, serif;
        }
        #id1{
            background-color: black;
            color: wheat;
            height: 100px;
            width: 450px;
            text-align: center;
        }
        #id2{
            height: 50px;
            width: 50px;
            background-color: red;
        }
        p{
            background-color: red;
            width: 150px;
        }
        #heading{
            text-transform: capitalize;
            text-align: center;
        }
        #outer{
            font-size: 25px;
        }
        #inner{
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="id1">
        <p>hello this is div</p>
        <div id="id2">
           yoo
        </div>
    </div>
    <br>
    <br>
    <br>
    <h1 id="heading">hello there how are you doing</h1>
    
    <div id="outer">
        outer
        <div id="inner">
            inner
        </div>
    </div>
 
</body>
</html>
